[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envelope"
version = "0.1.0"
description = "A complete neural network robustness verifier: a proof, or the counterexample, never 'unknown'"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aditya S" }]
keywords = ["verification", "abstract-interpretation", "adversarial-robustness",
            "neural-networks", "formal-methods"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3", "pyflakes"]

[tool.setuptools.packages.find]
include = ["ev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
